<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="file"] {
            margin-bottom: 15px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #response {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
        pre {
            margin: 0;
        }
    </style>
</head>
<body>
<h1>Upload Image</h1>
<form id="uploadForm" enctype="multipart/form-data">
    <label for="file">Select an image:</label>
    <input type="file" id="file" name="file" accept="image/*" required>

    <label for="token">Authorization Token:</label>
    <input type="text" id="token" name="token" placeholder="Enter JWT Token (Optional)" style="width: 100%; padding: 8px;">

    <button type="submit">Upload</button>
</form>

<div id="response" style="display: none;">
    <h2>Response</h2>
    <pre id="responseText"></pre>
</div>

<script>
    document.getElementById("uploadForm").addEventListener("submit", async (event) => {
        event.preventDefault();

        const fileInput = document.getElementById("file");
        const tokenInput = document.getElementById("token").value.trim();
        const responseDiv = document.getElementById("response");
        const responseText = document.getElementById("responseText");

        // 초기화
        responseDiv.style.display = "none";
        responseText.textContent = "";

        if (!fileInput.files.length) {
            alert("Please select a file to upload.");
            return;
        }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        try {
            const response = await fetch("http://localhost:8080/api/image/ImageSearch", {
                method: "POST",
                headers: tokenInput ? { "Authorization": `Bearer ${tokenInput}` } : {},
                body: formData
            });

            const result = await response.json();
            responseDiv.style.display = "block";

            if (response.ok) {
                responseText.textContent = JSON.stringify(result, null, 2);
            } else {
                responseText.textContent = `Error: ${result.message || "Unknown error"}`;
            }
        } catch (error) {
            responseDiv.style.display = "block";
            responseText.textContent = `Error: ${error.message}`;
        }
    });
</script>
</body>
</html>
